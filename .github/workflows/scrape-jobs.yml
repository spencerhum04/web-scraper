name: Scrape SWE Internship Jobs

on:
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '7,37 * * * *'

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
        
    - name: Install Playwright browsers and dependencies
      run: |
        python -m playwright install chromium
        sudo apt-get update
        sudo apt-get install -y xvfb libasound2t64 libnss3 libxss1 libatk-bridge2.0-0 libgtk-3-0 libdrm2 libgbm1 libxcomposite1 libxdamage1 libxrandr2 libatspi2.0-0 libpangocairo-1.0-0
        
    - name: Run job scrapers
      env:
        # Discord
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        
        # Supabase
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        xvfb-run -a python main.py
